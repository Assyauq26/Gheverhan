name: Verify Gheverhan Production OTP migration (read-only)

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Type the approved Supabase project ref to verify migration'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gheverhan-production-otp-schema
  cancel-in-progress: false

jobs:
  verification:
    if: ${{ github.ref == 'refs/heads/main' && inputs.project_ref == 'bztprltkevacidcpjaam' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-migration
    defaults:
      run:
        working-directory: frontend
    env:
      PROJECT_REF: ${{ inputs.project_ref }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout exact reviewed PR 70 release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b1e38ce3086ee85df5fd01e609cc5e89e3db949f
          persist-credentials: false
          sparse-checkout: frontend

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify immutable source and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b1e38ce3086ee85df5fd01e609cc5e89e3db949f"
          command -v psql >/dev/null || { echo 'BLOCKED: psql client unavailable'; exit 1; }

      - name: Verify completed OTP migration using read-only PostgreSQL SQL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          const ref = 'bztprltkevacidcpjaam';
          if (process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('Not dispatched from main');
          if (process.env.PROJECT_REF !== ref) throw new Error('Supabase target mismatch');
          function parse(key) {
            const value = process.env[key];
            if (!value) throw new Error('Missing protected secret: ' + key);
            const u = new URL(value);
            const host = u.hostname.toLowerCase();
            const goodHost = host === 'db.' + ref + '.supabase.co' ||
              (host.endsWith('.pooler.supabase.com') && decodeURIComponent(u.username).endsWith('.' + ref));
            if (!['postgres:','postgresql:'].includes(u.protocol) || !goodHost ||
                u.pathname !== '/postgres' || (u.searchParams.get('schema') || 'public') !== 'public')
              throw new Error('Protected DB secret does not identify approved Supabase project: ' + key);
            return { host, port: u.port || '5432', database: 'postgres',
              user: decodeURIComponent(u.username), password: decodeURIComponent(u.password) };
          }
          const runtime = parse('DATABASE_URL'), direct = parse('DIRECT_URL');
          if (runtime.database !== direct.database) throw new Error('DB binding mismatch');
          const dirs = fs.readdirSync('prisma/migrations').filter(x => /^\d{14}_[A-Za-z0-9_]+$/.test(x)).sort();
          if (dirs.length !== 7 || dirs.at(-1) !== '20261018150000_registration_email_otp')
            throw new Error('Unexpected repository migration set');
          const hashes = dirs.map(name => ({ name, sha: createHash('sha256').update(
            fs.readFileSync(path.join('prisma/migrations', name, 'migration.sql'))).digest('hex') }));
          if (hashes.at(-1).sha !== 'eec85ff983628830923da3c7b0760bfc20378bdcf9cb7376dd6b1cca539eb84e')
            throw new Error('OTP migration checksum mismatch');
          const tuples = hashes.map(x => "('" + x.name + "','" + x.sha + "')").join(',\n');
          const requiredColumns = [
            ['id','text','NO',null,null],
            ['email','text','NO',null,null],
            ['name','text','NO',null,null],
            ['phone','text','NO',null,null],
            ['passwordHash','text','NO',null,null],
            ['codeHash','text','NO',null,null],
            ['attempts','integer','NO','0',null],
            ['expiresAt','timestamp without time zone','NO',null,3],
            ['sentAt','timestamp without time zone','NO','CURRENT_TIMESTAMP',3],
            ['createdAt','timestamp without time zone','NO','CURRENT_TIMESTAMP',3],
          ];
          const quote = value => value === null ? 'NULL' : "'" + value.replace(/'/g, "''") + "'";
          const columnTuples = requiredColumns.map(c => '(' + c.map(quote).join(',') + ')').join(',\n');
          // Single, read-only SQL query via libpq's simple query protocol; avoids
          // Prisma prepared statement collisions behind Supabase PgBouncer.
          const sql = `BEGIN READ ONLY; SET LOCAL statement_timeout = '7s'; WITH expected(migration_name,checksum) AS (VALUES ${tuples}),
            complete AS (SELECT count(*)::int AS n FROM expected e JOIN public._prisma_migrations m
              ON m.migration_name=e.migration_name AND m.checksum=e.checksum
              AND m.finished_at IS NOT NULL AND m.rolled_back_at IS NULL),
            expected_columns(name,typ,nullable,default_text,precision) AS (VALUES ${columnTuples})
          SELECT CASE WHEN (SELECT n FROM complete)=7
            AND (SELECT count(*) FROM public._prisma_migrations)=7
            AND to_regclass('public."PendingRegistration"') IS NOT NULL
            AND EXISTS(SELECT 1 FROM information_schema.columns WHERE table_schema='public'
              AND table_name='User' AND column_name='emailVerifiedAt'
              AND data_type='timestamp without time zone' AND is_nullable='YES')
            AND (SELECT count(*) FROM pg_indexes WHERE schemaname='public'
              AND tablename='PendingRegistration' AND indexname IN
              ('PendingRegistration_pkey','PendingRegistration_email_key','PendingRegistration_expiresAt_idx'))=3
            AND (SELECT relrowsecurity FROM pg_class WHERE oid=to_regclass('public."PendingRegistration"'))
            AND (SELECT count(*) FROM pg_policies
              WHERE schemaname='public' AND tablename='PendingRegistration')=0
            AND (SELECT count(*) FROM information_schema.columns WHERE table_schema='public'
              AND table_name='PendingRegistration')=10
            AND (SELECT count(*) FROM expected_columns ec
              JOIN information_schema.columns c ON c.table_schema='public'
                AND c.table_name='PendingRegistration' AND c.column_name=ec.name
              WHERE c.data_type=ec.typ AND c.is_nullable=ec.nullable
                AND c.column_default IS NOT DISTINCT FROM ec.default_text
                AND c.datetime_precision IS NOT DISTINCT FROM ec.precision)=10
          THEN 'PASS' ELSE 'BLOCKED' END; COMMIT;`;
          const runtimeSql = `BEGIN READ ONLY; SET LOCAL statement_timeout = '7s';
          SELECT CASE WHEN
            has_table_privilege(current_user,'public."PendingRegistration"','SELECT') AND
            has_table_privilege(current_user,'public."PendingRegistration"','INSERT') AND
            has_table_privilege(current_user,'public."PendingRegistration"','UPDATE') AND
            has_table_privilege(current_user,'public."PendingRegistration"','DELETE') AND
            EXISTS(SELECT 1 FROM pg_roles r JOIN pg_class c
              ON c.oid=to_regclass('public."PendingRegistration"')
              WHERE r.rolname=current_user AND
                (r.rolsuper OR r.rolbypassrls OR
                  (r.oid=c.relowner AND NOT c.relforcerowsecurity)))
          THEN 'PASS' ELSE 'BLOCKED' END; COMMIT;`;
          function runReadOnlySql(binding, query) {
            // Uses the simple PostgreSQL query protocol to avoid Prisma's
            // prepared-statement collision behind the Supabase pooler.
            const proc = spawnSync('psql',
              ['--no-psqlrc','--no-align','--tuples-only','--quiet','--set','ON_ERROR_STOP=1'], {
              env: { ...process.env, PGHOST: binding.host, PGPORT: binding.port,
                PGUSER: binding.user, PGPASSWORD: binding.password, PGDATABASE: binding.database,
                PGSSLMODE: 'require' },
              input: query, encoding: 'utf8', timeout: 20000, maxBuffer: 1024 * 1024,
            });
            if (proc.error || proc.status !== 0 || proc.stdout.trim() !== 'PASS') {
              console.error('BLOCKED: read-only database check failed; do not retry migration');
              process.exitCode = 1;
              return false;
            }
            return true;
          }
          if (runReadOnlySql(direct, sql) && runReadOnlySql(runtime, runtimeSql)) {
            console.log('PASS: ledger 7/7 checksums, OTP columns/defaults/indexes, RLS without policies');
            console.log('PASS: effective runtime database role has OTP DML privileges and RLS access');
            console.log('PASS: both checks were READ-ONLY; no Prisma migration was executed');
          }
          NODE
