name: Unit tests with Critical containment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-containment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout application without persisting Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            frontend
            .github
      - name: Setup Node 22 for offline workflow policy tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify manual Production workflow protection offline
        run: node --test .github/tests/production-read-only-preflight.test.mjs .github/tests/helipod-preflight.test.mjs
      - name: Prepare locked dependencies without online application execution
        run: docker build --file frontend/Dockerfile.test --tag gheverhan-unit-tests frontend
      - name: Run all unit and containment tests offline without host credentials
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --pids-limit=128 --memory=2g --cpus=2
          --tmpfs /tmp:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=1777
          gheverhan-unit-tests
