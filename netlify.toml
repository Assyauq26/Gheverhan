[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Explicitly enable the Next.js runtime so SSR, App Router pages,
# Server Actions, and /api routes are deployed as Netlify Functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Authentication runtime secrets are configured in Netlify environment variables.
