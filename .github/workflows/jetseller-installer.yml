name: JetSeller verified installer foundation

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/jetseller-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
          cache: false
      - name: Vet and unit / Linux state / TLS protocol fixtures
        working-directory: agent
        run: |
          go vet ./...
          go test -race -count=1 -v ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/jetseller-setup-candidate ./cmd/jetseller-setup
      - name: Fetch pinned public upstream verification fixture
        run: |
          set -euo pipefail
          mkdir -m 700 /tmp/jetseller-cosign-fixture
          cd /tmp/jetseller-cosign-fixture
          for file in cosign-linux-amd64 cosign_checksums.txt cosign_checksums.txt.sigstore.json; do
            curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 --retry 2 --output "$file" "https://github.com/sigstore/cosign/releases/download/v3.1.4/$file"
          done
          sha256sum --check <<'HASHES'
          424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign-linux-amd64
          e70e59b328d52949b3a9ae3e0d04721ea8f380c4e91c28197aa91df02afbf4c0  cosign_checksums.txt
          8fc87b5562359b0414655ee281b80eb3752f58c4e137d5f0e4881f095bc26309  cosign_checksums.txt.sigstore.json
          HASHES
          chmod 700 cosign-linux-amd64
      - name: Verify real signed artifact, matching-hash tamper and wrong signer rejection
        working-directory: agent
        env:
          JETSELLER_COSIGN_FIXTURE: /tmp/jetseller-cosign-fixture
          JETSELLER_COSIGN_FILENAME: cosign-linux-amd64
          JETSELLER_COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: go test -count=1 -v ./internal/bootstrap -run TestRealCosignSignedArtifactAndTamper
