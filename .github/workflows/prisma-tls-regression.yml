name: Isolated Prisma TLS and redaction regression
on:
  pull_request:
    paths:
      - 'frontend/scripts/release/**'
      - 'frontend/tests/unit/*prisma*'
      - 'frontend/tests/unit/runtime-role-probe.test.ts'
      - 'frontend/tests/unit/preflight-diagnostics.test.ts'
      - 'frontend/tests/integration/prisma-tls.test.mjs'
      - 'frontend/tests/fixtures/prisma-tls/**'
      - '.github/workflows/prisma-tls-regression.yml'
      - '.github/workflows/production-read-only-preflight.yml'
      - '.github/tests/production-read-only-preflight.test.mjs'
      - '.github/scripts/run-prisma-tls-fixture.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prisma-tls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tls-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Validate protected workflow policy without credentials
        run: node --test ../.github/tests/production-read-only-preflight.test.mjs
      - name: Prepare pinned Prisma without any Production secret
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install prisma generate
          node scripts/release/verify-prisma-installation.mjs
      - name: Safe diagnostics and CA binding unit regressions
        run: npx --no-install vitest run tests/unit/prisma-transport.test.ts tests/unit/runtime-role-probe.test.ts tests/unit/preflight-diagnostics.test.ts
      - name: TLS CA, hostname, SCRAM, engine and metadata controls on disposable PostgreSQL
        run: bash ../.github/scripts/run-prisma-tls-fixture.sh
