name: Helipod VPS autodeploy

on:
  pull_request:
    paths:
      - ".github/workflows/helipod-autodeploy.yml"
      - "deploy/helipod/**"
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/helipod-autodeploy.yml"
      - "deploy/helipod/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and validate in disposable CI only; no production access"
        required: true
        default: true
        type: boolean
      confirm:
        description: "Type deploy-gheverhan to explicitly authorize this production release"
        required: false
        type: string
      release_sha:
        description: "Full HEAD commit SHA of main to deploy (must equal workflow commit)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gheverhan-helipod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate deploy scripts
        run: |
          set -euo pipefail
          bash -n deploy/helipod/deploy-release.sh
          bash -n deploy/helipod/bootstrap-autodeploy.sh

      - name: Build the Prisma migration image
        run: |
          set -euo pipefail
          docker build \
            --target build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "gheverhan-migrate:$GITHUB_SHA" \
            --file frontend/Dockerfile \
            frontend

      - name: Build the production app image
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "gheverhan:$GITHUB_SHA" \
            --file frontend/Dockerfile \
            frontend

      # Main push and PR run build-only. Never deploy production without an
      # explicit manual dispatch on main, matching HEAD SHA, confirmation, and
      # existing deployment allow-variable.
      - name: Verify the explicit production release request
        if: github.event_name == 'workflow_dispatch' && !inputs.build_only
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRM" = 'deploy-gheverhan'
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Install the restricted SSH deploy key and pinned host key
        if: github.event_name == 'workflow_dispatch' && !inputs.build_only && github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-gheverhan' && inputs.release_sha == github.sha && vars.HELI_POD_AUTODEPLOY == 'enabled'
        env:
          HELI_POD_DEPLOY_KEY_B64: ${{ secrets.HELI_POD_DEPLOY_KEY_B64 }}
          HELI_POD_SSH_KNOWN_HOSTS: ${{ vars.HELI_POD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HELI_POD_DEPLOY_KEY_B64" || { echo "Missing HELI_POD_DEPLOY_KEY_B64 repository secret."; exit 1; }
          test -n "$HELI_POD_SSH_KNOWN_HOSTS" || { echo "Missing HELI_POD_SSH_KNOWN_HOSTS repository variable."; exit 1; }
          key_file="$RUNNER_TEMP/gheverhan-helipod-deploy-key"
          known_hosts_file="$RUNNER_TEMP/gheverhan-helipod-known-hosts"
          printf '%s' "$HELI_POD_DEPLOY_KEY_B64" | base64 --decode > "$key_file"
          chmod 0600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          printf '%s\n' "$HELI_POD_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 0600 "$known_hosts_file"
          ssh-keygen -F "43.173.21.197" -f "$known_hosts_file" >/dev/null
          echo "HELI_POD_DEPLOY_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "HELI_POD_KNOWN_HOSTS_FILE=$known_hosts_file" >> "$GITHUB_ENV"

      - name: Stream the immutable images to the Helipod VPS
        if: github.event_name == 'workflow_dispatch' && !inputs.build_only && github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-gheverhan' && inputs.release_sha == github.sha && vars.HELI_POD_AUTODEPLOY == 'enabled'
        run: |
          set -euo pipefail
          docker save "gheverhan:$GITHUB_SHA" "gheverhan-migrate:$GITHUB_SHA" \
            | gzip -1 \
            | ssh -T \
                -i "$HELI_POD_DEPLOY_KEY_FILE" \
                -p 22 \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o PasswordAuthentication=no \
                -o KbdInteractiveAuthentication=no \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HELI_POD_KNOWN_HOSTS_FILE" \
                -o ConnectTimeout=15 \
                ubuntu@43.173.21.197

      - name: Verify the public production health endpoint
        if: github.event_name == 'workflow_dispatch' && !inputs.build_only && github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-gheverhan' && inputs.release_sha == github.sha && vars.HELI_POD_AUTODEPLOY == 'enabled'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused \
            https://gheverhan.store/api/v1/health

      - name: Confirm automatic production deployment is disabled
        if: github.event_name != 'workflow_dispatch' || inputs.build_only
        run: |
          echo "Build completed. Production deploy requires a separate explicit manual workflow_dispatch on main."
