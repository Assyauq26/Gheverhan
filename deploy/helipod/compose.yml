version: "3.8"
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: gheverhan
      POSTGRES_USER: gheverhan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gheverhan -d gheverhan"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  app:
    image: ${GHEVERHAN_IMAGE:?Set GHEVERHAN_IMAGE to the tested image}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      PASSWORD_RESET_FROM: "${PASSWORD_RESET_FROM:-Gheverhan <noreply@gheverhan.store>}"
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-https://gheverhan.store}
      STORAGE_APP_NAME: ${STORAGE_APP_NAME:-gheverhan}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-gh_session}
      MAINTENANCE_MODE: "${MAINTENANCE_MODE:-0}"
      REGION_DATA_MODE: "${REGION_DATA_MODE:-}"
      SHIPPING_PROVIDER: "${SHIPPING_PROVIDER:-manual}"
      JNT_MANUAL_RATE_CONFIG: "${JNT_MANUAL_RATE_CONFIG:-}"
      JNT_OFFICIAL_AREA_MAPPING: "${JNT_OFFICIAL_AREA_MAPPING:-}"
      JNT_ORIGIN_WAREHOUSE: "${JNT_ORIGIN_WAREHOUSE:-}"
      JNT_ORIGIN_CITY_CODE: "${JNT_ORIGIN_CITY_CODE:-}"
      JNT_SENDER_NAME: "${JNT_SENDER_NAME:-}"
      JNT_SENDER_CONTACT: "${JNT_SENDER_CONTACT:-}"
      JNT_SENDER_PHONE: "${JNT_SENDER_PHONE:-}"
      JNT_SENDER_ADDRESS: "${JNT_SENDER_ADDRESS:-}"
      JNT_ENABLE_ORDER_CREATE: "${JNT_ENABLE_ORDER_CREATE:-no}"
      JNT_ENABLE_CANCELLATION: "${JNT_ENABLE_CANCELLATION:-no}"
      JNT_PRODUCTION_ORDER_APPROVED: "${JNT_PRODUCTION_ORDER_APPROVED:-no}"
      JNT_API_ENV: "${JNT_API_ENV:-}"
      JNT_RATE_SERVICES: "${JNT_RATE_SERVICES:-}"
      JNT_PLATFORM_OWNER_USER_IDS: "${JNT_PLATFORM_OWNER_USER_IDS:-}"
      JNT_INTEGRATION_ENCRYPTION_KEY: "${JNT_INTEGRATION_ENCRYPTION_KEY:-}"
      APP_ORIGIN: https://gheverhan.store
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /data/media
      DATABASE_URL: postgresql://gheverhan_runtime:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@db:5432/gheverhan?schema=public&connection_limit=5
      DIRECT_URL: postgresql://gheverhan_runtime:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@db:5432/gheverhan?schema=public&connection_limit=5
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - /opt/gheverhan/media:/data/media
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 900m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  postgres:
  caddy_data:
  caddy_config:
