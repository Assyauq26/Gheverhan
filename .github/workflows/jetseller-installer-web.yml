name: JetSeller installer dashboard
on:
  pull_request:
    paths:
      - platform/installer-web/**
      - .github/workflows/jetseller-installer-web.yml
permissions:
  contents: read
concurrency:
  group: jetseller-installer-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  dashboard-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: platform/installer-web
      - run: npm test
        working-directory: platform/installer-web
