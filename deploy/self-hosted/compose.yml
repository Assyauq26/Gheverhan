name: ${COMPOSE_PROJECT_NAME:?installation project required}
services:
  db:
    image: postgres@sha256:2cd2c0f809604aaeff6f0ec8f40aecbd025613107561015c69369a1a7f1d3416
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: js_bootstrap
      POSTGRES_DB: ${JETSELLER_DATABASE_NAME:?database identity required}
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [bootstrap_password, migration_password, runtime_password]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-jetseller.sh:ro
      - ./grant-runtime.sh:/opt/jetseller/grant-runtime.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U js_bootstrap -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 1
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migrate:
    image: ${JETSELLER_MIGRATION_IMAGE:?migration digest required}
    profiles: [tools]
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [migration_config]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000']
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
    logging: *logs
  app:
    image: ${JETSELLER_APP_IMAGE:?app digest required}
    platform: linux/amd64
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [runtime_config]
    volumes: [media:/var/lib/jetseller/media]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
    networks: [database, edge, outbound]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/ready', {signal:AbortSignal.timeout(3500)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      start_period: 60s
      retries: 5
    mem_limit: 1536m
    cpus: 1
    pids_limit: 256
    logging: *logs
  caddy:
    image: caddy@sha256:04913b1da43339a40ad1ea87827d70a576ac5aa6cf674c6e24fdca675887533a
    platform: linux/amd64
    restart: unless-stopped
    environment:
      JETSELLER_STORE_DOMAIN: ${JETSELLER_STORE_DOMAIN:?verified domain required}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, outbound]
    depends_on: [app]
    mem_limit: 256m
    cpus: 0.5
    logging: *logs
networks:
  database: {internal: true}
  edge: {internal: true}
  outbound: {}
volumes:
  db_data: {}
  media: {}
  caddy_data: {}
  caddy_config: {}
secrets:
  bootstrap_password:
    file: ./private/bootstrap_password
  migration_password:
    file: ./private/migration_password
  runtime_password:
    file: ./private/runtime_password
  runtime_config:
    file: ./private/runtime.json
  migration_config:
    file: ./private/migration.json
