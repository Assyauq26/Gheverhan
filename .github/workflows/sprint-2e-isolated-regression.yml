name: Sprint 2E isolated PostgreSQL and browser regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/sprint-2e-isolated-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-2e-isolated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-integration-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: gheverhan_test
          POSTGRES_PASSWORD: isolated-local-only
          POSTGRES_DB: gheverhan_sprint1_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U gheverhan_test -d gheverhan_sprint1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      MAINTENANCE_MODE: "0"
      GHEVERHAN_ISOLATED_TESTS: "1"
      SPRINT1_TEST_DATABASE_URL: postgresql://gheverhan_test:isolated-local-only@127.0.0.1:5432/gheverhan_sprint1_test
      DATABASE_URL: postgresql://gheverhan_test:isolated-local-only@127.0.0.1:5432/gheverhan_sprint1_test
      DIRECT_URL: postgresql://gheverhan_test:isolated-local-only@127.0.0.1:5432/gheverhan_sprint1_test
      PAYMENT_PROVIDER: manual
      SHIPPING_PROVIDER: manual
      JWT_SECRET: only-in-isolated-ci-tests-please-never-reuse
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout only application and tests without persisted Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: frontend

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Prisma and apply existing migrations to disposable PostgreSQL
        run: |
          node node_modules/@prisma/engines/scripts/postinstall.js
          npm run prisma:generate
          npm run prisma:deploy

      - name: Install isolated Chromium browser and dependencies
        run: |
          npx playwright install --with-deps chromium
          node -e 'const { chromium } = require("@playwright/test"); require("node:fs").appendFileSync(process.env.GITHUB_ENV, "SPRINT1_CHROMIUM_PATH=" + chromium.executablePath() + "\n");'

      - name: Check types, ESLint and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Prepare CI-only server-only marker for direct Node service imports
        # Next.js resolves this import during app build. Direct tsx tests need a no-op
        # local module marker; do not add it to package.json or production artifacts.
        run: |
          mkdir -p node_modules/server-only
          echo 'module.exports = {};' > node_modules/server-only/index.js
          git show HEAD:frontend/next-env.d.ts > next-env.d.ts

      - name: Real private Supabase Storage API provider contract on disposable containers
        run: node scripts/run-private-storage-drill.mjs

      - name: Direct database entrypoint safety in a disposable local schema
        run: node --import tsx --test tests/integration/database-entrypoints.test.ts

      - name: Real PostgreSQL session revocation, reset and atomic auth limits
        run: node --import tsx --test tests/integration/auth-security.test.ts

      - name: Read-only release preflight rejects legacy schema, missing configuration and insufficient privileges
        run: node --import tsx --test tests/integration/release-preflight.test.ts

      - name: Registration migration lock failure and recovery on disposable PostgreSQL
        run: node --import tsx --test tests/integration/registration-migration.test.ts

      - name: Custom variation migration/backfill and official Prisma recovery drill
        run: node --import tsx --test tests/integration/custom-variation-migration.test.ts

      - name: Custom variation relational, image and concurrency invariants
        run: node --import tsx --test tests/integration/custom-variations.test.ts
      - name: Registration identity index upgrade, transactional recovery and generic-plan performance
        run: node --import tsx --test tests/integration/registration-indexes.test.ts

      - name: Real PostgreSQL concurrent cart increments and first-cart creation
        run: node --import tsx --test tests/integration/cart-concurrency.test.ts

      - name: Real PostgreSQL product lifecycle and concurrency
        run: npm run test:integration:products

      - name: Direct checkout official Prisma fresh, upgrade and bounded lock recovery
        run: node --import tsx --test tests/integration/direct-checkout-migration.test.ts

      - name: Isolated Buy Now ownership, replay, cart preservation and inventory concurrency
        run: node --disable-proto=throw --import tsx --test tests/integration/direct-checkout.test.ts

      - name: Real PostgreSQL checkout and transaction correctness
        run: npm run test:integration:transactions

      - name: Real PostgreSQL refunds, shipping and stock invariants
        run: npm run test:integration:refund-shipping

      - name: Product editor V2 staged media, shipping and migration recovery
        working-directory: frontend
        run: |
          node --disable-proto=throw --import tsx --test tests/integration/product-size-chart-migration.test.ts
          node --disable-proto=throw --import tsx --test tests/integration/product-editor-v2-migration.test.ts
          node --disable-proto=throw --import tsx --test tests/integration/product-editor-v2.test.ts

      - name: Chromium product media, upload and RBAC test with loopback storage double
        id: product_browser
        run: npm run test:e2e:products

      - name: Chromium operations/payment proof and RBAC test with loopback storage double
        id: operations_browser
        run: npm run test:e2e:operations

      - name: Registration email OTP lifecycle on disposable PostgreSQL
        run: node --import tsx --test tests/integration/registration-otp.test.ts

      - name: Registration conflict, metadata, recovery and provider isolation
        run: node --import tsx --test tests/integration/registration-conflicts.test.ts

      - name: Chromium auth UI and public legal regression on dummy PostgreSQL
        id: auth_ui_browser
        env:
          SPRINT1_ARTIFACT_DIR: /tmp/gheverhan-auth-ui-${{ github.run_id }}
        run: node --import tsx tests/integration/auth-ui-browser.ts

      - name: Chromium regression for microtask replay of hydrated Flight content
        id: hydration_replay
        run: node --import tsx tests/integration/react-hydration-replay.ts

      - name: Chromium navigation and mobile responsiveness regression
        id: navigation
        run: |
          for iteration in $(seq 1 10); do
            SPRINT1_ARTIFACT_DIR="/tmp/gheverhan-navigation-${GITHUB_RUN_ID}-${iteration}" \
              node --import tsx tests/integration/navigation-browser.ts
          done

      - name: Build an identical-commit stability matrix, including partial failures
        if: ${{ !cancelled() && steps.navigation.outcome != 'skipped' }}
        run: node scripts/navigation-stability-matrix.mjs /tmp "gheverhan-navigation-${GITHUB_RUN_ID}-" "/tmp/gheverhan-stability-${GITHUB_RUN_ID}"

      - name: Retain synthetic navigation diagnostics, including failed runs
        if: ${{ !cancelled() && (steps.product_browser.outcome != 'skipped' || steps.operations_browser.outcome != 'skipped' || steps.navigation.outcome != 'skipped' || steps.hydration_replay.outcome != 'skipped' || steps.auth_ui_browser.outcome != 'skipped') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: navigation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/gheverhan-navigation-*/navigation-results.json
            /tmp/gheverhan-product-browser-*/validation-results.json
            /tmp/gheverhan-product-browser-*/product-*.png
            /tmp/gheverhan-product-browser-*/editor-v2-*.png
            /tmp/gheverhan-product-browser-*/cart-concurrency-*.json
            /tmp/gheverhan-operations-browser-*/validation-results.json
            /tmp/gheverhan-navigation-*/*-dashboard.png
            /tmp/react-hydration-replay-*/hydration-replay-results.json
            /tmp/gheverhan-stability-*/navigation-stability-matrix.*
            /tmp/gheverhan-auth-ui-*/auth-ui-results.json
            /tmp/gheverhan-auth-ui-*/*.png
          if-no-files-found: error
          retention-days: 7
