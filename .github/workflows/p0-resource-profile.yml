name: P0 disposable resource profile
on:
  pull_request:
    paths: ['agent/**', 'deploy/self-hosted/**', '.github/workflows/p0-resource-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-resource-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  privileged-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3', cache: false}
      - run: |
          set -euo pipefail
          go -C agent test ./...
          go -C agent vet ./...
          go -C agent test -c -o /tmp/p0-bootstrap.test ./internal/bootstrap
          go -C agent test -c -o /tmp/p0-installer.test ./internal/installer
          sudo /tmp/p0-bootstrap.test -test.run '^TestP0InstallState' -test.v
          sudo /tmp/p0-installer.test -test.run '^TestP0' -test.v
  resource-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: {go-version: '1.27.3', cache: false}
      - name: Build probe outside seller VM
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0-payload
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C agent test -c -o /tmp/p0-payload/resource-probe.test ./internal/bootstrap
      - name: Actual Ubuntu VM with 2 vCPU 2 GiB and 40 GB disk
        env:
          P0_DISPOSABLE_CI_CONFIRM: only-disposable-ci
        run: bash deploy/self-hosted/tests/p0-vm.sh /tmp/p0-payload
      - name: Preserve resource-only evidence (not full provisioning proof)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p0-resource-only-evidence
          path: /tmp/buattokosendiri-p0-vm.*/evidence/**
          if-no-files-found: warn
          retention-days: 7
