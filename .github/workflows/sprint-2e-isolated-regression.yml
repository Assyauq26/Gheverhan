name: Sprint 2E isolated PostgreSQL and browser regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/sprint-2e-isolated-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-2e-isolated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-integration-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: gheverhan_test
          POSTGRES_PASSWORD: isolated-local-only
          POSTGRES_DB: gheverhan_sprint1_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U gheverhan_test -d gheverhan_sprint1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      GHEVERHAN_ISOLATED_TESTS: "1"
      SPRINT1_TEST_DATABASE_URL: postgresql://gheverhan_test:isolated-local-only@127.0.0.1:5432/gheverhan_sprint1_test
      DATABASE_URL: postgresql://gheverhan_test:isolated-local-only@127.0.0.1:5432/gheverhan_sprint1_test
      DIRECT_URL: postgresql://gheverhan_test:isolated-local-only@127.0.0.1:5432/gheverhan_sprint1_test
      PAYMENT_PROVIDER: manual
      SHIPPING_PROVIDER: manual
      JWT_SECRET: only-in-isolated-ci-tests-please-never-reuse
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout only application and tests without persisted Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: frontend

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Prisma and apply existing migrations to disposable PostgreSQL
        run: |
          node node_modules/@prisma/engines/scripts/postinstall.js
          npm run prisma:generate
          npm run prisma:deploy

      - name: Install isolated Chromium browser and dependencies
        run: npx playwright install --with-deps chromium

      - name: Check types, ESLint and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Prepare CI-only server-only marker for direct Node service imports
        # Next.js resolves this import during app build. Direct tsx tests need a no-op
        # local module marker; do not add it to package.json or production artifacts.
        run: |
          mkdir -p node_modules/server-only
          printf 'module.exports = {};\\n' > node_modules/server-only/index.js

      - name: Real PostgreSQL product lifecycle and concurrency
        run: npm run test:integration:products

      - name: Real PostgreSQL checkout and transaction correctness
        run: npm run test:integration:transactions

      - name: Real PostgreSQL refunds, shipping and stock invariants
        run: npm run test:integration:refund-shipping

      - name: Chromium product media, upload and RBAC test with loopback storage double
        run: npm run test:e2e:products

      - name: Chromium operations/payment proof and RBAC test with loopback storage double
        run: npm run test:e2e:operations

      - name: Chromium navigation and mobile responsiveness regression
        run: node --import tsx tests/integration/navigation-browser.ts
